<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>忆灵 · 形象</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --ctl: #2a3544;
      --line: #3d4b5c;
      --txt: #e7ecf3;
      --muted: #93a1b3;
      --accent: #6ea8fe;
      --ok: #5fd08a;
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font-family: system-ui, "Segoe UI", sans-serif; }
    #bar { padding: 10px 14px; background: var(--panel); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
    #bar button, #bar select { background: var(--ctl); color: var(--txt); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
    #bar button { cursor: pointer; }
    #bar button:hover { border-color: var(--accent); }
    #stage { position: relative; width: 100%; height: calc(100% - 53px); }
    #c { width: 100%; height: 100%; display: block; }
    #l2d { position: absolute; inset: 0; display: none; }
    #status { font-size: 12px; color: var(--muted); margin-left: auto; }
    #lip { font-size: 12px; color: var(--ok); }
    #css-fallback {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; color: var(--muted); text-align: center; padding: 20px;
    }
    .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); display: inline-block; margin-right: 8px; }
    #title { font-weight: 600; }
  </style>
</head>
<body>
  <div id="bar">
    <strong id="title">忆灵 · 形象</strong>
    <select id="models" style="min-width:200px;max-width:360px"></select>
    <button id="load">加载</button>
    <button id="spin">旋转</button>
    <span id="lip"></span>
    <span id="status">初始化中…</span>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="l2d"></div>
    <div id="css-fallback">
      <div style="font-size:40px">🧍</div>
      <div>正在加载形象引擎…</div>
    </div>
  </div>

  <!-- Live2D 本地运行库 -->
  <script src="./vendor/live2dcubismcore.min.js"></script>
  <script src="./vendor/pixi.min.js"></script>
  <script src="./vendor/pixi-live2d-display.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js",
      "three/addons/loaders/GLTFLoader.js": "./vendor/GLTFLoader.js",
      "three/addons/loaders/RGBELoader.js": "./vendor/RGBELoader.js",
      "three/addons/postprocessing/EffectComposer.js": "./vendor/postprocessing/EffectComposer.js",
      "three/addons/postprocessing/RenderPass.js": "./vendor/postprocessing/RenderPass.js",
      "three/addons/postprocessing/ShaderPass.js": "./vendor/postprocessing/ShaderPass.js",
      "@pixiv/three-vrm": "./vendor/three-vrm.module.js",
      "@pixiv/three-vrm-animation": "./vendor/three-vrm-animation.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { VRMLoaderPlugin } from '@pixiv/three-vrm';
    import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';

    const canvas = document.getElementById('c');
    const l2dHost = document.getElementById('l2d');
    const fallback = document.getElementById('css-fallback');
    const statusEl = document.getElementById('status');
    const lipEl = document.getElementById('lip');
    const setStatus = (t) => { statusEl.textContent = t; };

    
    const showEngineError = (err) => {
      try {
        const msg = (err && (err.message || String(err))) || "unknown";
        if (fallback) {
          fallback.style.display = "flex";
          fallback.innerHTML = "<div style=\"font-size:40px\">⚠️</div><div style=\"max-width:520px;padding:0 16px;line-height:1.5\">形象引擎加载失败<br/><span style=\"color:#f66;font-size:12px;word-break:break-all\">" + msg + "</span></div>";
        }
        if (statusEl) statusEl.textContent = "引擎错误";
        console.error("[mnemos-avatar] engine error", err);
      } catch (e) {}
    };
    window.addEventListener("error", (ev) => { showEngineError(ev.error || ev.message); });
    window.addEventListener("unhandledrejection", (ev) => { showEngineError(ev.reason); });

// ---- 渲染?/ 场景 / 相机 ----
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xc8d4e0); // soft daylight fallback until room loads
    const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 80);
    camera.position.set(0.35, 1.45, 2.85);
    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 1.05, 0);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.minDistance = 0.8;
    controls.maxDistance = 6.5;
    controls.update();
    scene.add(new THREE.AmbientLight(0xfff2e8, 0.72));
    const key = new THREE.DirectionalLight(0xfff6ea, 1.05);
    key.position.set(1.6, 3.4, 2.2);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xb8d0ff, 0.35);
    fill.position.set(-2.2, 2.0, -1.2);
    scene.add(fill);
    const warm = new THREE.PointLight(0xffc48a, 0.55, 8, 2);
    warm.position.set(-0.6, 1.7, 0.4);
    scene.add(warm);
    
    // ---- Indoor scene: Poly Pizza JapaneseRoom GLB (CC-BY, Aimi Sekiguchi) ----
    let roomRoot = null;
    (async function loadIndoorScene() {
      try {
        const loader = new GLTFLoader();
        const gltf = await loader.loadAsync("./scenes/anime_room/japaneseroom.glb");
        roomRoot = gltf.scene || gltf.scenes?.[0];
        if (!roomRoot) throw new Error("empty room gltf");
        roomRoot.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(roomRoot);
        const size = new THREE.Vector3();
        box.getSize(size);
        const targetHeight = 2.55;
        const sc = size.y > 1e-4 ? (targetHeight / size.y) : 1;
        roomRoot.scale.setScalar(sc);
        roomRoot.updateMatrixWorld(true);
        const box2 = new THREE.Box3().setFromObject(roomRoot);
        const c2 = new THREE.Vector3();
        box2.getCenter(c2);
        roomRoot.position.x -= c2.x;
        roomRoot.position.z -= c2.z;
        roomRoot.position.y -= box2.min.y;
        roomRoot.traverse((o) => {
          if (o.isMesh) {
            o.castShadow = false;
            o.receiveShadow = true;
            if (o.material) {
              const mats = Array.isArray(o.material) ? o.material : [o.material];
              mats.forEach((m) => { if (m && m.map) m.map.colorSpace = THREE.SRGBColorSpace; });
            }
          }
        });
        scene.add(roomRoot);
        scene.background = new THREE.Color(0xb9c9d8);
        console.info("[mnemos-avatar] anime room GLB loaded (JapaneseRoom CC-BY)", size.toArray());
      } catch (e) {
        console.warn("[mnemos-avatar] room GLB failed, warm fallback floor", e);
        scene.background = new THREE.Color(0xc8d4e0);
        const floor = new THREE.Mesh(
          new THREE.CircleGeometry(3.2, 64),
          new THREE.MeshStandardMaterial({ color: 0xd9c6b0, roughness: 0.9, metalness: 0.02 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);
      }
    })();
    const root = new THREE.Group();
    scene.add(root);
    let spinning = false;
    let currentVrm = null;
    let pixiApp = null;
    let live2dModel = null;
    let cfg = { models: [], selected: '', dlss5: null };

    // ---- VRM idle (VRMA files) / lookAt / blink / mouth ----
    // Idle clips: ACCAD Female1 stand/sway/sway2/wait/look/swing  VRMA (CC-BY 3.0), via vrm-c/bvh2vrma
    const IDLE_VRMA_URLS = [
      "./motions/idle.vrma",
      "./motions/idle_2.vrma",
      "./motions/idle_3.vrma",
      "./motions/idle_4.vrma",
      "./motions/idle_5.vrma",
      "./motions/idle_6.vrma",
    ];
    let loadGen = 0;
    let loadedModelUri = "";
    let loadingModelUri = "";
    let idleMixer = null;
    let idleActions = [];
    let idleClips = [];
    let idleCurrent = -1;
    let idleSwitchAt = 0;
    let idleWeight = 1.0;
    let idleTargetWeight = 1.0;
    let lookAtTarget = null;
    let blinkState = { phase: "open", value: 0, nextAt: 0 };
    let mouthState = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0, envelope: 0 };
    let timeData = null;
    let idleClockT = 0;
    const MOUTH_NAMES = ["aa", "ih", "ou", "ee", "oh"];
    const IDLE_CROSSFADE = 0.65;
    const IDLE_HOLD_MIN = 4.5;
    const IDLE_HOLD_MAX = 9.0;

    // sidecar 基址（viewer ?Tauri origin 加载，模型走 sidecar HTTP?
    const SIDECAR = "http://127.0.0.1:18765";
    function sidecarUrl(u) {
      if (!u) return u;
      if (/^https?:\/\//.test(u)) return u;
      return SIDECAR + (u.startsWith("/") ? u : "/" + u);
    }

    // 与主窗口同源（Tauri origin），?BroadcastChannel 通信
    const channel = new BroadcastChannel("mnemos_avatar");
    channel.onmessage = (e) => onCommand(e.data);
    function send(d) { channel.postMessage(d); }

    function show3d(show) {
      canvas.style.display = show ? 'block' : 'none';
      l2dHost.style.display = show ? 'none' : 'block';
    }

    function disposeVrmExtras() {
      if (idleActions && idleActions.length) {
        idleActions.forEach((a) => { try { a.stop(); a.reset(); } catch (e) {} });
      }
      idleActions = [];
      idleClips = [];
      idleCurrent = -1;
      idleSwitchAt = 0;
      if (idleMixer) {
        try { idleMixer.stopAllAction(); } catch (e) {}
      }
      idleMixer = null;
      idleClockT = 0;
      if (lookAtTarget) {
        try { scene.remove(lookAtTarget); } catch (e) {}
        lookAtTarget = null;
      }
      blinkState = { phase: "open", value: 0, nextAt: 0 };
      mouthState = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0, envelope: 0 };
      idleWeight = 1.0;
      idleTargetWeight = 1.0;
    }

    function clearRoot() {
      disposeVrmExtras();
      if (currentVrm) {
        try {
          currentVrm.scene.traverse((o) => {
            if (o.geometry) o.geometry.dispose?.();
            if (o.material) {
              const mats = Array.isArray(o.material) ? o.material : [o.material];
              mats.forEach((m) => { try { m.map?.dispose?.(); m.dispose?.(); } catch (e) {} });
            }
          });
        } catch (e) {}
      }
      currentVrm = null;
      while (root.children.length) {
        const ch = root.children[root.children.length - 1];
        root.remove(ch);
        try { ch.traverse?.((o) => { if (o.geometry) o.geometry.dispose?.(); }); } catch (e) {}
      }
    }
    function pickNextIdleIndex(exclude) {
      if (!idleActions.length) return -1;
      if (idleActions.length === 1) return 0;
      let n = Math.floor(Math.random() * idleActions.length);
      if (n === exclude) n = (n + 1) % idleActions.length;
      return n;
    }

    function playIdleIndex(idx, fade) {
      if (idx < 0 || idx >= idleActions.length) return;
      const next = idleActions[idx];
      const prev = idleCurrent >= 0 ? idleActions[idleCurrent] : null;
      idleCurrent = idx;
      try {
        next.reset();
        next.setEffectiveWeight(idleWeight);
        next.setEffectiveTimeScale(1);
        next.clampWhenFinished = false;
        next.setLoop(THREE.LoopRepeat, Infinity);
        if (prev && prev !== next && fade > 0) {
          prev.crossFadeTo(next, fade, false);
          next.play();
        } else {
          next.play();
        }
      } catch (e) {
        console.warn("[mnemos-avatar] idle play failed", e);
      }
      idleSwitchAt = idleClockT + IDLE_HOLD_MIN + Math.random() * (IDLE_HOLD_MAX - IDLE_HOLD_MIN);
    }

    async function loadIdleVrmaClips(vrm) {
      idleClips = [];
      idleActions = [];
      if (!idleMixer || !vrm) return false;
      const loader = new GLTFLoader();
      loader.register((parser) => new VRMAnimationLoaderPlugin(parser));
      let ok = 0;
      for (const url of IDLE_VRMA_URLS) {
        try {
          const gltf = await loader.loadAsync(url);
          const anims = gltf.userData.vrmAnimations || [];
          if (!anims.length) {
            console.warn("[mnemos-avatar] no vrmAnimations in", url);
            continue;
          }
          const clip = createVRMAnimationClip(anims[0], vrm);
          clip.name = url.split("/").pop() || "idle";
          const action = idleMixer.clipAction(clip);
          action.setEffectiveWeight(0);
          idleClips.push(clip);
          idleActions.push(action);
          ok += 1;
        } catch (e) {
          console.warn("[mnemos-avatar] VRMA load failed", url, e);
        }
      }
      console.info("[mnemos-avatar] idle VRMA loaded", ok, "/", IDLE_VRMA_URLS.length);
      if (ok > 0) {
        const first = pickNextIdleIndex(-1);
        idleActions.forEach((a, i) => {
          try { a.setEffectiveWeight(i === first ? idleWeight : 0); } catch (e) {}
        });
        playIdleIndex(first, 0);
        return true;
      }
      return false;
    }

    function setupVrmExtras(vrm) {
      disposeVrmExtras();
      if (!vrm) return;
      lookAtTarget = new THREE.Object3D();
      lookAtTarget.position.copy(camera.position);
      scene.add(lookAtTarget);
      if (vrm.lookAt) {
        vrm.lookAt.target = lookAtTarget;
        vrm.lookAt.autoUpdate = true;
      }
      try {
        idleMixer = new THREE.AnimationMixer(vrm.scene);
      } catch (e) {
        idleMixer = null;
      }
      blinkState.nextAt = performance.now() / 1000 + 1.5 + Math.random() * 2.5;
      // async VRMA ?default path; no procedural arm pose
      loadIdleVrmaClips(vrm).then((ok) => {
        if (!ok) {
          console.warn("[mnemos-avatar] all VRMA failed; avatar may rest in bind pose until assets available");
        }
      });
    }

    function updateIdle(dt) {
      const fade = 2.8;
      const prevW = idleWeight;
      if (idleWeight < idleTargetWeight) idleWeight = Math.min(idleTargetWeight, idleWeight + dt * fade);
      else if (idleWeight > idleTargetWeight) idleWeight = Math.max(idleTargetWeight, idleWeight - dt * fade);

      idleClockT += dt;
      if (idleMixer) {
        try { idleMixer.update(dt); } catch (e) {}
      }
      // Scale action weights when speak-dampen changes, without wiping crossfade ratios
      if (idleActions.length && Math.abs(idleWeight - prevW) > 1e-5) {
        const scale = prevW > 1e-4 ? (idleWeight / prevW) : idleWeight;
        for (const a of idleActions) {
          try { a.setEffectiveWeight(Math.max(0, a.getEffectiveWeight() * scale)); } catch (e) {}
        }
      }
      if (idleClockT >= idleSwitchAt && idleActions.length > 1) {
        const n = pickNextIdleIndex(idleCurrent);
        playIdleIndex(n, IDLE_CROSSFADE);
      }
    }

    function updateGazeAndBlink(dt) {
      if (!currentVrm) return;
      if (lookAtTarget) {
        const wanderT = idleClockT;
        const wx = Math.sin(wanderT * 0.37) * 0.09;
        const wy = Math.sin(wanderT * 0.27 + 1.3) * 0.055;
        const tx = camera.position.x + wx;
        const ty = camera.position.y + wy;
        const tz = camera.position.z;
        const k = 1 - Math.exp(-3.2 * dt);
        lookAtTarget.position.x += (tx - lookAtTarget.position.x) * k;
        lookAtTarget.position.y += (ty - lookAtTarget.position.y) * k;
        lookAtTarget.position.z += (tz - lookAtTarget.position.z) * k;
      }
      const em = currentVrm.expressionManager;
      if (!em) return;
      const now = performance.now() / 1000;
      if (blinkState.phase === "open") {
        if (now >= blinkState.nextAt) blinkState.phase = "closing";
      } else if (blinkState.phase === "closing") {
        blinkState.value = Math.min(1, blinkState.value + dt * 14);
        if (blinkState.value >= 1) blinkState.phase = "opening";
      } else if (blinkState.phase === "opening") {
        blinkState.value = Math.max(0, blinkState.value - dt * 9);
        if (blinkState.value <= 0) {
          blinkState.phase = "open";
          blinkState.value = 0;
          blinkState.nextAt = now + 2.0 + Math.random() * 3.8;
          if (Math.random() < 0.12) blinkState.nextAt = now + 0.12;
        }
      }
      try {
        if (em.expressionMap?.blink || em.getExpression?.("blink")) {
          em.setValue("blink", blinkState.value);
        }
      } catch (e) {}
    }

    function buildPlaceholder() {
      clearRoot();
      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.32, 0.85, 6, 14),
        new THREE.MeshStandardMaterial({ color: 0x6ea8fe, metalness: 0.2, roughness: 0.5 })
      );
      body.position.y = 0.95;
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.27, 24, 18),
        new THREE.MeshStandardMaterial({ color: 0xffe0bd, roughness: 0.6 })
      );
      head.position.y = 1.82;
      root.add(body, head);
    }

    // ---- 理：DLSS5 各阶?shader ----
    const NeuralRenderShader = {
      uniforms: { tDiffuse: { value: null }, uStyle: { value: 0 }, uIntensity: { value: 0.5 }, uStructure: { value: 0.5 }, uPx: { value: 1 / 1024 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform float uIntensity; uniform float uStructure; uniform vec2 uPx;
        varying vec2 vUv;
        float lum(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }
        void main(){
          vec3 c = texture2D(tDiffuse, vUv).rgb;
          float l = lum(c);
          // 部结构（边缘?
          float lx = lum(texture2D(tDiffuse, vUv+vec2(uPx.x,0)).rgb);
          float ly = lum(texture2D(tDiffuse, vUv+vec2(0,uPx.y)).rgb);
          float edge = clamp(abs(l-lx)+abs(l-ly), 0.0, 1.0);
          // 边缘保留的局强（神经渲染近似?
          float k = uIntensity * (1.0 - edge*uStructure*2.0);
          vec3 outc = c + (c - vec3(0.5)) * k * 0.6;
          // 风格化：轻微平滑暗部
          outc = mix(outc, vec3(l), (1.0-edge)*uIntensity*0.12);
          gl_FragColor = vec4(clamp(outc,0.0,1.0), 1.0);
        }`
    };

    const DenoiseShader = {
      uniforms: { tDiffuse: { value: null }, uStrength: { value: 0.5 }, uPx: { value: 1 / 1024 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform float uStrength; uniform vec2 uPx; varying vec2 vUv;
        void main(){
          vec3 c = texture2D(tDiffuse, vUv).rgb;
          vec3 sum=vec3(0.0); float w=0.0;
          for(int x=-1;x<=1;x++) for(int y=-1;y<=1;y++){
            vec2 o=vec2(float(x),float(y))*uPx;
            sum += texture2D(tDiffuse, vUv+o).rgb; w+=1.0;
          }
          vec3 avg = sum/w;
          gl_FragColor = vec4(mix(c, avg, uStrength*0.6), 1.0);
        }`
    };

    // 边缘感知超分（FSR EASU 风格的简化版?
    const UpscaleShader = {
      uniforms: { tDiffuse: { value: null }, uTexel: { value: 1 / 1024 }, uSharpen: { value: 0.4 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform vec2 uTexel; uniform float uSharpen; varying vec2 vUv;
        void main(){
          // 方向臂应：取 4 居，沿最度方向插?
          vec3 c = texture2D(tDiffuse, vUv).rgb;
          vec3 n = texture2D(tDiffuse, vUv+vec2(0,uTexel.y)).rgb;
          vec3 s = texture2D(tDiffuse, vUv-vec2(0,uTexel.y)).rgb;
          vec3 e = texture2D(tDiffuse, vUv+vec2(uTexel.x,0)).rgb;
          vec3 w = texture2D(tDiffuse, vUv-vec2(uTexel.x,0)).rgb;
          vec3 gx = e-w, gy = n-s;
          float ax = length(gx), ay = length(gy);
          vec3 adaptive = (ax>ay) ? mix(c,(n+s)*0.5,0.5) : mix(c,(e+w)*0.5,0.5);
          // RCAS 锐化
          vec3 sharp = c*1.5 - (n+s+e+w)*0.125;
          vec3 outc = mix(adaptive, sharp, uSharpen);
          gl_FragColor = vec4(clamp(outc,0.0,1.0),1.0);
        }`
    };

    // CAS 锐化
    const CASShader = {
      uniforms: { tDiffuse: { value: null }, uStrength: { value: 0.5 }, uPx: { value: 1 / 1024 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform float uStrength; uniform vec2 uPx; varying vec2 vUv;
        void main(){
          vec3 c = texture2D(tDiffuse, vUv).rgb;
          vec3 b = ( texture2D(tDiffuse,vUv+vec2(uPx.x,0)).rgb
                   + texture2D(tDiffuse,vUv-vec2(uPx.x,0)).rgb
                   + texture2D(tDiffuse,vUv+vec2(0,uPx.y)).rgb
                   + texture2D(tDiffuse,vUv-vec2(0,uPx.y)).rgb ) * 0.25;
          float minG=min(c.r,min(c.g,c.b));
          float maxG=max(c.r,max(c.g,c.b));
          float d = 1.0-minG;
          float w = mix(1.0, sqrt(d/max(maxG,1e-4)), uStrength);
          vec3 outc = c + (c-b)*uStrength*w*2.0;
          gl_FragColor = vec4(clamp(outc,0.0,1.0),1.0);
        }`
    };

    // 调色 + 曝光 + 色温
    const ColorShader = {
      uniforms: {
        tDiffuse: { value: null }, uContrast: { value: 0 }, uSat: { value: 0 },
        uExposure: { value: 0 }, uTemp: { value: 0 }
      },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform float uContrast; uniform float uSat; uniform float uExposure; uniform float uTemp;
        varying vec2 vUv;
        void main(){
          vec3 c = texture2D(tDiffuse, vUv).rgb;
          c *= 1.0 + uExposure;
          c = (c-0.5)*(1.0+uContrast)+0.5;
          float l = dot(c,vec3(0.299,0.587,0.114));
          c = mix(vec3(l), c, 1.0+uSat);
          c.r += uTemp*0.06; c.b -= uTemp*0.06;
          gl_FragColor = vec4(clamp(c,0.0,1.0),1.0);
        }`
    };

    // HDR 色调映射（Reinhard + 
    const HDRShader = {
      uniforms: { tDiffuse: { value: null }, uPeak: { value: 1000.0 }, uSat: { value: 0 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform float uPeak; uniform float uSat; varying vec2 vUv;
        void main(){
          vec3 c = texture2D(tDiffuse, vUv).rgb;
          vec3 h = c/(1.0+c);
          h = pow(h, vec3(1.0/2.2));
          float l = dot(h,vec3(0.299,0.587,0.114));
          h = mix(vec3(l), h, 1.0+uSat);
          gl_FragColor = vec4(clamp(h,0.0,1.0),1.0);
        }`
    };

    // 胶片颗粒
    const GrainShader = {
      uniforms: { tDiffuse: { value: null }, uAmount: { value: 0.2 }, uSize: { value: 1.0 }, uColor: { value: 0 }, uTime: { value: 0 }, uPx: { value: 1 / 1024 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform float uAmount; uniform float uSize; uniform float uColor; uniform float uTime; uniform vec2 uPx;
        varying vec2 vUv;
        float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
        void main(){
          vec3 c = texture2D(tDiffuse, vUv).rgb;
          vec2 gp = vUv/(uPx*uSize);
          float g = hash(floor(gp)+floor(uTime*24.0));
          vec3 gc = vec3(g);
          if(uColor>0.0){ gc = vec3(hash(gp+uTime),hash(gp+uTime*1.3),hash(gp+uTime*0.7)); }
          // 暗部颗粒
          float l = dot(c,vec3(0.299,0.587,0.114));
          float a = uAmount*(1.2-l);
          gl_FragColor = vec4(mix(c, gc, a),1.0);
        }`
    };

    // ---- ?composer ----
    let composer = null;
    let renderPass = null;
    const passes = {};
    let lowResRT = null;

    function makePass(shader) { return new ShaderPass(shader); }

    function buildComposer() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      const d = cfg.dlss5;
      const useSR = d && d.enabled && d.super_resolution && d.super_resolution.enabled;
      let scale = 1;
      if (useSR) scale = Number(d.super_resolution.render_scale || 0.67);
      const rw = Math.max(2, Math.round(w * scale));
      const rh = Math.max(2, Math.round(h * scale));
      lowResRT = new THREE.WebGLRenderTarget(rw, rh, {
        type: THREE.HalfFloatType,
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter,
      });
      composer = new EffectComposer(renderer, lowResRT);
      composer.setSize(w, h);
      renderPass = new RenderPass(scene, camera);
      composer.addPass(renderPass);

      if (d && d.enabled) {
        const px = new THREE.Vector2(1 / rw, 1 / rh);
        if (d.neural_render?.enabled) {
          const p = makePass(NeuralRenderShader);
          p.uniforms.uStyle.value = 0;
          p.uniforms.uIntensity.value = d.neural_render.intensity;
          p.uniforms.uStructure.value = d.neural_render.structure;
          p.uniforms.uPx.value = px;
          composer.addPass(p); passes.neural_render = p;
        }
        if (d.ray_reconstruction?.enabled) {
          const p = makePass(DenoiseShader);
          p.uniforms.uStrength.value = d.ray_reconstruction.denoise;
          p.uniforms.uPx.value = px;
          composer.addPass(p); passes.ray_reconstruction = p;
        }
        if (useSR) {
          const p = makePass(UpscaleShader);
          p.uniforms.uTexel.value = px;
          p.uniforms.uSharpen.value = d.super_resolution.sharpen;
          composer.addPass(p);
        }
        if (d.sharpening?.enabled) {
          const p = makePass(CASShader);
          p.uniforms.uStrength.value = d.sharpening.strength;
          p.uniforms.uPx.value = new THREE.Vector2(1 / w, 1 / h);
          composer.addPass(p); passes.sharpening = p;
        }
        if (d.coloring?.enabled) {
          const p = makePass(ColorShader);
          p.uniforms.uContrast.value = d.coloring.contrast;
          p.uniforms.uSat.value = d.coloring.saturation;
          p.uniforms.uExposure.value = d.coloring.exposure;
          p.uniforms.uTemp.value = d.coloring.temperature;
          composer.addPass(p); passes.coloring = p;
        }
        if (d.hdr?.enabled) {
          const p = makePass(HDRShader);
          p.uniforms.uPeak.value = d.hdr.peak_luminance;
          p.uniforms.uSat.value = d.hdr.saturation;
          composer.addPass(p); passes.hdr = p;
        }
        if (d.grain?.enabled) {
          const p = makePass(GrainShader);
          p.uniforms.uAmount.value = d.grain.amount;
          p.uniforms.uSize.value = d.grain.size;
          p.uniforms.uColor.value = d.grain.color;
          p.uniforms.uPx.value = new THREE.Vector2(1 / w, 1 / h);
          composer.addPass(p); passes.grain = p;
        }
      }
    }

    // ---- 唇形 ----
    const speakAudio = new Audio();
    speakAudio.crossOrigin = "anonymous";
    let audioCtx = null, analyser = null, freqData = null;
    let lipActive = false;
    let currentSpeakId = null;

    function ensureAudioGraph() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const srcNode = audioCtx.createMediaElementSource(speakAudio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.75;
      srcNode.connect(analyser);
      analyser.connect(audioCtx.destination);
      freqData = new Uint8Array(analyser.frequencyBinCount);
    }

    function bandLevel(hzLo, hzHi) {
      const binHz = audioCtx.sampleRate / 2 / analyser.frequencyBinCount;
      const i0 = Math.max(1, Math.floor(hzLo / binHz));
      const i1 = Math.min(analyser.frequencyBinCount - 1, Math.ceil(hzHi / binHz));
      let sum = 0, n = 0;
      for (let i = i0; i <= i1; i++) { sum += freqData[i]; n++; }
      return n ? sum / n / 255 : 0;
    }

    function updateLip(dt) {
      const em = currentVrm?.expressionManager;
      const dtSafe = Math.max(1 / 120, Math.min(0.05, dt || 1 / 60));
      const targets = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };

      if (lipActive && analyser && freqData) {
        analyser.getByteFrequencyData(freqData);
        if (!timeData || timeData.length !== analyser.fftSize) {
          timeData = new Uint8Array(analyser.fftSize);
        }
        analyser.getByteTimeDomainData(timeData);
        let sumSq = 0;
        for (let i = 0; i < timeData.length; i++) {
          const v = (timeData[i] - 128) / 128;
          sumSq += v * v;
        }
        const rms = Math.sqrt(sumSq / timeData.length);
        const SILENCE = 0.018;
        if (rms >= SILENCE) {
          const raw = {
            aa: bandLevel(200, 500),
            ou: bandLevel(500, 900),
            ih: bandLevel(900, 1600),
            ee: bandLevel(1600, 3000),
            oh: bandLevel(3000, 6000),
          };
          // 斥：softmax，避免五口同时大
          const TEMP = 0.2;
          let maxR = 1e-6;
          for (const n of MOUTH_NAMES) maxR = Math.max(maxR, raw[n]);
          let sumE = 0;
          const exps = {};
          for (const n of MOUTH_NAMES) {
            exps[n] = Math.exp((raw[n] / maxR) / TEMP);
            sumE += exps[n];
          }
          const energy = Math.min(1, ((rms - SILENCE) / 0.11)) * Math.min(1, maxR * 2.4);
          for (const n of MOUTH_NAMES) {
            targets[n] = (exps[n] / sumE) * energy;
          }
        }
      }

      // envelope：张较慢、闭合较?
      const openRate = 9;
      const closeRate = 18;
      for (const n of MOUTH_NAMES) {
        const cur = mouthState[n];
        const tgt = targets[n];
        const rate = tgt > cur ? openRate : closeRate;
        const k = 1 - Math.exp(-rate * dtSafe);
        mouthState[n] = cur + (tgt - cur) * k;
      }
      mouthState.envelope = Math.max(
        mouthState.aa, mouthState.ih, mouthState.ou, mouthState.ee, mouthState.oh
      );

      if (em) {
        for (const n of MOUTH_NAMES) {
          if (em.expressionMap?.[n] || em.getExpression?.(n)) {
            em.setValue(n, mouthState[n]);
          }
        }
      }
      lipEl.textContent = mouthState.envelope > 0.04
        ? `唇形 ${Math.round(mouthState.envelope * 100)}%`
        : "";
    }

    function resetMouth() {
      for (const n of MOUTH_NAMES) mouthState[n] = 0;
      mouthState.envelope = 0;
      const em = currentVrm?.expressionManager;
      if (em) MOUTH_NAMES.forEach((n) => { try { em.setValue(n, 0); } catch (e) {} });
      lipEl.textContent = "";
    }

    function speak(url, id) {
      ensureAudioGraph();
      if (audioCtx.state === "suspended") audioCtx.resume();
      currentSpeakId = id;
      speakAudio.src = url;
      lipActive = true;
      idleTargetWeight = 0.22;
      const p = speakAudio.play();
      if (p && p.catch) p.catch((e) => { lipEl.textContent = "播放失败: " + e.message; });
      setStatus("正在朗读（唇形同步）");
    }
    speakAudio.onended = () => {
      lipActive = false;
      idleTargetWeight = 1.0;
      resetMouth();
      setStatus("朗读结束");
      send({ type: "avatar-ended", id: currentSpeakId });
    };

    function pauseSpeak() { speakAudio.pause(); setStatus("已暂停"); }
    function resumeSpeak() { if (audioCtx?.state === "suspended") audioCtx.resume(); speakAudio.play(); setStatus("继续朗读"); }
    function stopSpeak() {
      lipActive = false;
      idleTargetWeight = 1.0;
      try { speakAudio.pause(); speakAudio.currentTime = 0; } catch (e) {}
      resetMouth();
      setStatus("已停止");
    }

    // ---- 加载 VRM ----
    async function loadVrm(uri) {
      const gen = ++loadGen;
      loadingModelUri = uri || "";
      clearRoot();
      show3d(true);
      const loader = new GLTFLoader();
      loader.register((parser) => new VRMLoaderPlugin(parser));
      try {
        const gltf = await loader.loadAsync(uri);
        if (gen !== loadGen) return;
        const vrm = gltf.userData.vrm;
        if (vrm) {
          currentVrm = vrm;
          root.add(vrm.scene);
          vrm.scene.rotation.y = Math.PI;
          vrm.scene.position.set(0, 0, 0);
          setupVrmExtras(vrm);
          setStatus("已加载 VRM（VRMA idle / 眼神 / 唇形）");
        } else {
          root.add(gltf.scene);
          setStatus("已加载模型（非 VRM）");
        }
        loadedModelUri = uri || "";
        loadingModelUri = "";
        rebuildPipeline();
      } catch (e) {
        if (gen !== loadGen) return;
        loadingModelUri = "";
        buildPlaceholder();
        rebuildPipeline();
        setStatus("VRM 加载失败，显示占位");
      }
    }
    function disposeLive2d() {
      try { live2dModel?.destroy({ children: true }); } catch (e) {}
      try { pixiApp?.destroy(true, { children: true }); } catch (e) {}
      live2dModel = null; pixiApp = null;
      l2dHost.innerHTML = "";
    }

    async function loadLive2d(uri) {
      show3d(false);
      clearRoot();
      disposeLive2d();
      try {
        if (!window.PIXI || !PIXI.live2d) throw new Error("Live2D 运行库缺失");
        pixiApp = new PIXI.Application({
          view: (() => { const v = document.createElement("canvas"); l2dHost.appendChild(v); return v; })(),
          autoStart: true, backgroundAlpha: 0, resizeTo: l2dHost,
        });
        live2dModel = await PIXI.live2d.Live2DModel.from(uri);
        pixiApp.stage.addChild(live2dModel);
        const fit = () => {
          if (!live2dModel?.width) return;
          const s = Math.min(l2dHost.clientWidth / live2dModel.width, l2dHost.clientHeight / live2dModel.height) * 0.92;
          live2dModel.scale.set(s);
          live2dModel.anchor.set(0.5, 0.5);
          live2dModel.position.set(l2dHost.clientWidth / 2, l2dHost.clientHeight / 2);
        };
        fit();
        live2dModel.once("load", fit);
        setStatus("已加载 Live2D");
      } catch (e) {
        show3d(true);
        buildPlaceholder();
        setStatus("Live2D 加载失败，显示占位");
      }
    }

    function classify(uri) {
      const u = uri.split("?")[0].toLowerCase();
      if (u.endsWith(".vrm")) return "vrm";
      if (u.endsWith((".model3.json", ".model.json", ".moc3", ".moc"))) return "live2d";
      return "unknown";
    }
    function loadModel(uri, opts) {
      const force = !!(opts && opts.force);
      if (!uri) {
        loadGen++; loadedModelUri = ""; loadingModelUri = "";
        show3d(true); buildPlaceholder(); rebuildPipeline(); return;
      }
      if (!force && (uri === loadedModelUri || uri === loadingModelUri)) {
        console.info("[mnemos-avatar] skip duplicate loadModel", uri);
        return;
      }
      const kind = classify(uri);
      if (kind === "vrm") return loadVrm(uri);
      if (kind === "live2d") return loadLive2d(uri);
      setStatus("未知模型格式");
    }

    // ----  / 渲染 ----
    function resize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / Math.max(1, h);
      camera.updateProjectionMatrix();
      if (composer) composer.setSize(w, h);
      if (pixiApp) { try { pixiApp.renderer.resize(l2dHost.clientWidth, l2dHost.clientHeight); } catch (e) {} }
    }
    window.addEventListener("resize", resize);

    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      if (spinning) root.rotation.y += dt * 0.6;
      controls.update();
      // idle ?gaze/blink ?vrm.update（lookAt/expression）→ 唇形
      updateIdle(dt);
      updateGazeAndBlink(dt);
      if (currentVrm?.update) currentVrm.update(dt);
      updateLip(dt);
      if (canvas.style.display !== "none") {
        if (composer && cfg.dlss5?.enabled) composer.render();
        else renderer.render(scene, camera);
      }
    }

    function rebuildPipeline() {
      // 重建理（配置变化或模型变化）
      if (composer) { try { composer.dispose(); } catch (e) {} composer = null; }
      if (lowResRT) { try { lowResRT.dispose(); } catch (e) {} }
      Object.keys(passes).forEach((k) => delete passes[k]);
      if (cfg.dlss5?.enabled) buildComposer();
      resize();
    }

    // ---- 模型下拉 ----
    const sel = document.getElementById("models");
    function fillModels(list) {
      sel.innerHTML = "";
      const ph = document.createElement("option");
      ph.value = ""; ph.textContent = "— 选择模型 —";
      sel.appendChild(ph);
      (list || []).forEach((m) => {
        const o = document.createElement("option");
        // 模型走 sidecar HTTP（补全基址）
        o.value = sidecarUrl(m.url || m.path);
        o.textContent = `${m.name}（${m.format}）`;
        sel.appendChild(o);
      });
    }

    
    // ---- 接收主窗口命令（BroadcastChannel，同源）----
    function onCommand(d) {
      if (!d || !d.type) return;
      switch (d.type) {
        case "avatar-init":
          cfg = {
            models: d.models || [],
            selected: d.selected_url || d.selected || "",
            dlss5: d.dlss5 || null,
          };
          fillModels(cfg.models);
          if (cfg.selected) {
            const u = sidecarUrl(cfg.selected);
            sel.value = u;
            loadModel(u);
          } else if (!currentVrm) {
            show3d(true); buildPlaceholder(); rebuildPipeline();
          }
          if (cfg.dlss5) rebuildPipeline();
          setStatus("已就绪");
          send({ type: "avatar-ready" });
          break;
        case "avatar-speak":
          speak(sidecarUrl(d.url), d.id);
          break;
        case "avatar-pause": pauseSpeak(); break;
        case "avatar-resume": resumeSpeak(); break;
        case "avatar-stop": stopSpeak(); break;
        case "avatar-config":
          if (d.dlss5 !== undefined) { cfg.dlss5 = d.dlss5; rebuildPipeline(); }
          if (d.selected_url !== undefined || d.selected !== undefined) {
            const u = sidecarUrl(d.selected_url || d.selected || "");
            cfg.selected = u;
            if (u) loadModel(u);
          }
          break;
      }
    }

    document.getElementById("load").onclick = () => { if (sel.value) loadModel(sel.value); };
    document.getElementById("spin").onclick = () => { spinning = !spinning; };

    // ----  ----
    fallback.style.display = "none";
    setStatus("形象引擎已就绪");
    show3d(true);
    buildPlaceholder();
    resize();
    animate();

    //  query ?model= 直接加载
    const q = new URLSearchParams(location.search).get("model");
    if (q) {
      const u = sidecarUrl(q);
      const o = document.createElement("option");
      o.value = u; o.textContent = q.split(/[\\/]/).pop();
      sel.appendChild(o);
      sel.value = u;
      loadModel(u);
    } else {
      setStatus("等待主窗口配置…");
      send({ type: "avatar-request-init" });
    }
  </script>
</body>
</html>
